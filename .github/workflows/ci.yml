name: Babycowans CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: protocol/babycowans-protocol

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/babycowans-protocol/target
          key: protocol-${{ runner.os }}-${{ hashFiles('protocol/babycowans-protocol/**/Cargo.toml', 'protocol/babycowans-protocol/rust-toolchain.toml') }}
          restore-keys: |
            protocol-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run protocol tests
        run: cargo test --workspace --all-targets --locked

      - name: Install pinned Anchor CLI for ABI generation
        run: cargo install --git https://github.com/solana-foundation/anchor --rev 1314a6b83b16e6a31947b372d57988fd0e81559c anchor-cli --locked

      - name: Verify pinned Anchor CLI
        run: anchor --version | grep -F 'anchor-cli 1.0.2'

      - name: Generate IDL from Rust ABI
        run: anchor idl build

      - name: Verify Protocol V1.0.0 ABI compatibility
        run: python3 ../../scripts/check-idl-abi.py

  sdk:
    name: SDK Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: sdk/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build SDK
        run: yarn build

      - name: Test PDA utilities
        run: yarn test:pda

      - name: Test instruction builders
        run: yarn test:instructions

      - name: Test IDL consistency
        run: yarn test:idl

      - name: Test account decoder
        run: yarn test:decoder

      - name: Test Read API ABI boundaries
        run: yarn tsx tests/read-api.test.ts

      - name: Test event decoder ABI boundaries
        run: yarn tsx tests/event-decoder.test.ts

      - name: Test event decoder client integration
        run: yarn tsx tests/event-decoder-client.test.ts

      - name: Audit runtime dependencies
        run: yarn audit --groups dependencies
