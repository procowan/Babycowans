name: Babycowans CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: protocol/babycowans-protocol

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/babycowans-protocol/target
          key: protocol-${{ runner.os }}-${{ hashFiles('protocol/babycowans-protocol/**/Cargo.toml', 'protocol/babycowans-protocol/rust-toolchain.toml') }}
          restore-keys: |
            protocol-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run protocol tests
        run: cargo test --workspace --all-targets --locked

      - name: Run release Clippy gate
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --locked \
            --offline \
            -- \
            -D warnings \
            -A clippy::too_many_arguments

      - name: Fetch locked fuzz dependencies
        run: cargo fetch --manifest-path programs/babycowans-protocol/fuzz/Cargo.toml --locked

      - name: Compile fuzz targets from the locked graph
        run: |
          cargo check \
            --manifest-path programs/babycowans-protocol/fuzz/Cargo.toml \
            --locked \
            --offline

      - name: Verify deterministic canonical ecosystem generation
        env:
          RUSTUP_TOOLCHAIN: "1.89.0"
        run: python3 ../../scripts/check-canonical-ecosystems.py

      - name: Install pinned Anchor CLI for ABI generation
        run: cargo install --git https://github.com/solana-foundation/anchor --rev 1314a6b83b16e6a31947b372d57988fd0e81559c anchor-cli --locked

      - name: Verify pinned Anchor CLI
        run: anchor --version | grep -F 'anchor-cli 1.0.2'

      - name: Generate IDL from Rust ABI
        run: mkdir -p target/idl && anchor idl build --out target/idl/babycowans_protocol.json

      - name: Verify Protocol V1.0.0 ABI compatibility
        run: python3 ../../scripts/check-idl-abi.py

  sdk:
    name: SDK Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Verify runtime dependency contract
        run: yarn test:dependencies

      - name: Typecheck SDK
        run: yarn typecheck

      - name: Build SDK
        run: yarn build

      - name: Test PDA utilities
        run: yarn test:pda

      - name: Test instruction builders
        run: yarn test:instructions

      - name: Test numeric serialization boundaries
        run: yarn test:numeric-boundaries

      - name: Test IDL consistency
        run: yarn test:idl

      - name: Test account decoder
        run: yarn test:decoder

      - name: Test Read API ABI boundaries
        run: yarn tsx tests/read-api.test.ts

      - name: Test event decoder ABI boundaries
        run: yarn tsx tests/event-decoder.test.ts

      - name: Test event decoder client integration
        run: yarn tsx tests/event-decoder-client.test.ts

      - name: Test high-level SDK client
        run: yarn test:high-level-client

      - name: Test canonical batch composition
        run: yarn test:batch

      - name: Test application developer experience
        run: yarn test:application-experience

      - name: Test metadata and canonical identity
        run: yarn test:metadata

      - name: Test SDK error model
        run: yarn test:error-model

      - name: Test runtime boundary
        run: yarn test:runtime-boundary

      - name: Test release-relevant properties
        run: yarn test:property

      - name: Test packed SDK external consumer and tracked examples
        run: yarn test:packed-consumer

      - name: Audit runtime dependencies
        run: yarn test:audit

      - name: Test runtime audit fail-closed behavior
        run: yarn test:audit:regression

  astra_runtime:
    name: ASTRA Runtime Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"
      - name: Install SDK dependencies
        working-directory: sdk
        run: yarn install --frozen-lockfile --non-interactive
      - name: Install Agave 3.1.10
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Verify Solana toolchain
        run: |
          solana --version
          solana-test-validator --version
          spl-token --version
      - name: Install pinned Anchor CLI
        run: |
          cargo install --git https://github.com/solana-foundation/anchor --rev 1314a6b83b16e6a31947b372d57988fd0e81559c anchor-cli --locked
      - name: Verify Anchor
        run: anchor --version | grep -F "anchor-cli 1.0.2"
      - name: Build deployable program
        working-directory: protocol/babycowans-protocol
        run: anchor build --ignore-keys
      - name: Record runtime identity
        run: |
          mkdir -p .astra-evidence
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "TREE=$(git rev-parse HEAD^{tree})"
            rustc --version
            cargo --version
            node --version
            yarn --version
            solana --version
            anchor --version
            sha256sum protocol/babycowans-protocol/target/deploy/babycowans_protocol.so
          } | tee .astra-evidence/runtime-identity.txt
      - name: Provision ephemeral runtime authority
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new             --no-bip39-passphrase             --force             --silent             --outfile "$HOME/.config/solana/id.json"
          solana config set --keypair "$HOME/.config/solana/id.json"
          test -n "$(solana address)"
      - name: Default release-critical E2E
        run: |
          set -o pipefail
          (cd sdk && yarn test:e2e) 2>&1 | tee .astra-evidence/default-e2e.log
      - name: Six-ecosystem golden E2E
        run: |
          set -o pipefail
          (cd sdk && yarn test:god:isolated) 2>&1 | tee .astra-evidence/golden-six.log
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-runtime-evidence
          path: .astra-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  astra_fuzz:
    name: ASTRA Differential Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Build fuzz targets
        working-directory: protocol/babycowans-protocol/programs/babycowans-protocol
        run: cargo +nightly fuzz build
      - name: Run fail-closed semantic fuzz assurance
        working-directory: protocol/babycowans-protocol/programs/babycowans-protocol
        env:
          BABYCOWANS_FUZZ_EVIDENCE_DIR: ${{ github.workspace }}/.astra-evidence/fuzz-semantic
          BABYCOWANS_FUZZ_SEED: "424242"
          BABYCOWANS_FUZZ_MUTATED_RUNS: "512"
          BABYCOWANS_FUZZ_PAYMENT_RUNS: "2048"
        run: bash fuzz/semantic-gate.sh
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-fuzz-evidence
          path: .astra-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
